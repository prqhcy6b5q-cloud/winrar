name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: Windows Build
    runs-on: windows-2022
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.PAT_TOKEN }}

    - name: Update submodule to local modifications
      run: |
        git -C libs/hbb_common checkout 54e5bf59ce76c79638c350a6ddc8ac4b80da945e
        git -C libs/hbb_common pull origin master --no-rebase

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.75
        targets: x86_64-pc-windows-msvc

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '120deac3062162151622ca4860575a33844ba10b'

    - name: Install vcpkg dependencies
      shell: bash
      run: |
        vcpkg install --triplet x64-windows-static

    - name: Build
      env:
        RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
      shell: bash
      run: |
        cargo build --release --target x86_64-pc-windows-msvc

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: winrar-windows-x64
        path: target/x86_64-pc-windows-msvc/release/winrar.exe
